[platformio]
default_envs = repin_bw
build_dir = .pio/build
libdeps_dir = .pio/libdeps

[env:repin_bw]
platform = platformio/nordicnrf52@11.0.0
platform_packages = platformio/framework-arduinoadafruitnrf52@1.10601.0
board = promicro_nrf52840_s140v6
board_build.variant = promicro_repin
board_build.ldscript = eink_s140_v6.ld
framework = arduino
extra_scripts = pre:sanitize_paths.py
lib_deps =
    zinggjm/GxEPD2@1.6.9
    adafruit/Adafruit GFX Library@1.12.4
    adafruit/Adafruit BusIO@1.17.4
monitor_speed = 115200
