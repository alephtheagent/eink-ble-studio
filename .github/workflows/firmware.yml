name: Firmware

'on':
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Application version (uint32, BCD; 66048 = 0x010200 = 1.2.0)
        required: true
        default: '66048'
        type: string
  pull_request:
    paths:
      - 'firmware/**'
      - 'web/**'
      - 'tools/**'
      - 'tests/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/firmware.yml'

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    env:
      # pip's adafruit-nrfutil installs this CLI name, not nrfutil.
      NRFUTIL: adafruit-nrfutil
    steps:
      - uses: actions/checkout@v4
      - name: Remove old artifacts
        run: rm -rf artifacts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-
      - name: Install dependencies
        run: |
          pip install platformio pyelftools unicorn adafruit-nrfutil
          npm ci
      - name: Build firmware
        run: pio run -d firmware -e repin_bw
      - name: Package and verify firmware
        run: PYTHONPATH=tools python3 tools/package_firmware.py
      - name: Package and verify Nordic DFU
        env:
          APPLICATION_VERSION: ${{ inputs.version || '66048' }}
        run: |
          python3 tools/dfu_package.py artifacts/eink-ble-welcome-once-dfu-bw-s140v6.hex --application-version "$APPLICATION_VERSION" --output artifacts/eink-ble-welcome-once-dfu-bw-s140v6.dfu.zip
          cp artifacts/eink-ble-welcome-once-dfu-bw-s140v6.dfu.zip artifacts/eink-ble-welcome-once-dfu-bw-s140v6-dfu.zip
      - name: Test
        run: npm test
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-artifacts
          path: artifacts/
          if-no-files-found: warn
      - name: Publish release
        if: ${{ success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          fail_on_unmatched_files: true
          files: |
            artifacts/eink-ble-welcome-once-dfu-bw-s140v6.uf2
            artifacts/eink-ble-welcome-once-dfu-bw-s140v6.zip
            artifacts/eink-ble-welcome-once-dfu-bw-s140v6.dfu.zip
            artifacts/eink-ble-welcome-once-dfu-bw-s140v6-dfu.zip
            artifacts/verification*.json
            artifacts/*-dfu.json
