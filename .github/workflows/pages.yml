name: Pages

'on':
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  # After a release the DFU package must be refreshed in the published tree:
  # GitHub release assets redirect to release-assets.githubusercontent.com, which
  # sends no Access-Control-Allow-Origin, so a browser fetch of the asset fails.
  # Serving the same bytes from Pages keeps the OTA download same-origin.
  workflow_run:
    workflows: [Firmware]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy the latest DFU package into the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p web/firmware
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest"
          asset=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$api" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((a['url'] for a in d.get('assets', []) if a['name'].endswith('-dfu.zip')), ''))")
          if [ -z "$asset" ]; then echo '::error::latest release has no -dfu.zip asset'; exit 1; fi
          curl -sSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/octet-stream' "$asset" -o web/firmware/latest-dfu.zip
          test -s web/firmware/latest-dfu.zip
          python3 - <<'PY'
          import json, zipfile, urllib.request, os
          path = 'web/firmware/latest-dfu.zip'
          with zipfile.ZipFile(path) as z:
              manifest = json.loads(z.read('manifest.json'))['manifest']
          assert manifest.get('dfu_version') == 0.5, manifest
          version = manifest['application']['init_packet_data']['application_version']
          open('web/firmware/latest.json', 'w').write(json.dumps({'applicationVersion': version}) + '\n')
          print('packaged DFU application_version', version)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
